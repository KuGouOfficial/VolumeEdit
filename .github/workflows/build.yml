name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build, test and package
        shell: pwsh
        run: ./tools/package.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: VolumeEdit-portable-x64
          path: |
            out/VolumeEdit-portable-*-x64.zip
            out/VolumeEdit-portable-*-x64.zip.sha256
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: VolumeEdit-test-reports
          path: out/reports/
          if-no-files-found: warn
